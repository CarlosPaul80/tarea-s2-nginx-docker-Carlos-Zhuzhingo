name: Practica de Nginx y Docker
on:
  workflow_dispatch:
  push:
    paths:
      - index1.html
      - index2.html
      - practica.py
      - capturas.py
      - .github/workflows/practica.yml
permissions:
  contents: write
jobs:
  practica:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crear y personalizar los dos contenedores
        run: python practica.py
      - name: Preparar el navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capturar los servidores en el navegador
        run: python capturas.py
      - name: Guardar las evidencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidencias
          if ! git diff --cached --quiet; then
            git commit -m "Guardar resultados y capturas de la practica"
            git push
          fi
